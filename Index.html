<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abu al-Fadl NFC - الملف الشخصي والبطاقة التعريفية الإلكترونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b5fff; --blue-dark:#0a3fae; --navy:#0e1b3d; --ink:#1b2a4a; --muted:#6b7794;
  --line:#d9e1f2; --bg1:#eaf1ff; --bg2:#f3eeff; --card:rgba(255,255,255,.92);
  --ok:#12a150; --err:#d92d3a; --field:#ffffff; --shadow:0 20px 50px rgba(20,50,120,.16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8eefc; --muted:#9aa8c9; --line:#2b3a63; --bg1:#0b1430; --bg2:#141033;
    --card:rgba(20,30,62,.92); --field:#101b3b; --navy:#e8eefc; --shadow:0 20px 50px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:'Cairo','Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:var(--ink); background:linear-gradient(135deg,var(--bg1),var(--bg2)); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 14px 40px;
  position:relative; overflow-x:hidden;
}
html[lang="en"] body{font-family:'Inter','Cairo',system-ui,sans-serif}
.net{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.topbar{position:relative;z-index:2;width:100%;max-width:440px;display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.icon-btn:focus-visible{outline:3px solid rgba(11,95,255,.45);outline-offset:2px}
.card{
  position:relative;z-index:1;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.view{display:none}.view.active{display:block}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.brand svg{width:38px;height:38px}
.brand b{font-family:'Inter',sans-serif;font-size:22px;color:var(--navy);letter-spacing:-.5px}
h1{font-size:19px;text-align:center;margin-bottom:4px;color:var(--ink)}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
.field{margin-bottom:13px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink)}
.inp{position:relative;display:flex;align-items:center;gap:6px}
.inp .ic{position:absolute;inset-inline-start:11px;color:var(--muted);display:flex;pointer-events:none}
.inp .ic svg{width:17px;height:17px}
input,select{
  width:100%;height:44px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);color:var(--ink);
  font:inherit;font-size:14px;padding-inline:38px 12px;transition:border-color .15s, box-shadow .15s;
}
input.plain,select.plain{padding-inline:12px}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,95,255,.14);outline:none}
input[dir="ltr"],.ltr{direction:ltr;text-align:left}
html[dir="rtl"] input[dir="ltr"]{padding-inline:12px 38px}
.inp.has-ic input[dir="ltr"]{padding-left:38px;padding-right:12px}
html[dir="rtl"] .inp.has-ic input[dir="ltr"]{padding-left:12px;padding-right:12px}
.inp.pw.has-ic input[dir="ltr"]{padding-right:44px}
html[dir="rtl"] .inp.pw.has-ic input[dir="ltr"]{padding-left:44px;padding-right:12px}
.inp input.err,.inp select.err{border-color:var(--err)}
.icon-btn{position:absolute;inset-inline-end:8px;background:none;border:0;cursor:pointer;color:var(--muted);display:flex;padding:6px;border-radius:8px}
.icon-btn svg{width:18px;height:18px}
.inp.pw input{padding-inline-end:42px}
.btn{
  height:44px;border:0;border-radius:11px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, background .15s, opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--blue);color:#fff;width:100%}
.btn.primary:hover:not([disabled]){background:var(--blue-dark)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);width:100%}
.btn.soft{background:rgba(11,95,255,.1);color:var(--blue);white-space:nowrap}
.btn.small{height:44px;padding:0 14px;font-size:13px}
.row{display:flex;gap:8px;align-items:stretch}
.row .inp{flex:1}
.hint{font-size:12px;margin-top:5px;min-height:16px;color:var(--muted)}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--err)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:14px;flex-wrap:wrap}
a,.lnk{color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:0;font:inherit;font-size:13px}
.lnk:hover{text-decoration:underline}
.resend{font-size:12px;color:var(--muted);white-space:nowrap;padding-inline:10px;display:flex;align-items:center}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--blue)}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
.avatar{position:relative;width:104px;height:104px;border-radius:50%;border:3px solid var(--blue);background:#dfe6f5;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.avatar svg{width:56px;height:56px;color:#9aa6c3}
.avatar-plus{position:absolute;bottom:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}
.avatar-wrap .up{font-size:13px;color:var(--blue);margin-top:8px;cursor:pointer;background:none;border:0;font-family:inherit}
h2{font-size:16px;margin:18px 0 4px}
.soc{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.soc .badge{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;font:700 12px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
.soc .soc-name{flex:0 0 76px;font-size:13px;font-weight:600}
.soc input{height:40px;padding-inline:12px;font-size:13px;direction:ltr;text-align:left}
.other-row{display:grid;grid-template-columns:1fr 1.6fr 34px;gap:6px;margin-bottom:8px}
.other-row input{height:40px;padding-inline:10px;font-size:13px;direction:ltr;text-align:left}
.other-row button{border:0;background:rgba(217,45,58,.1);color:var(--err);border-radius:10px;cursor:pointer;font-size:16px}
.file-row{display:flex;gap:8px}
.file-row input[type=text]{flex:1}
.toast-box{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none;padding:0 14px}
.toast{background:#101a36;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.ok{background:#0c7a3d}.toast.bad{background:#b3202c}
/* البطاقة التعريفية */
.idcard{text-align:center}
.idcard .avatar{cursor:default;width:120px;height:120px;margin:4px auto 12px}
.idcard h1{font-size:21px;margin-bottom:0}
.idcard .un{color:var(--muted);direction:ltr;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:16px}
.linklist{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.linkbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--field)}
.linkbtn:hover{border-color:var(--blue)}
.linkbtn .badge{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;font:700 11px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
.linkbtn span.t{flex:1;text-align:start;font-size:14px;font-weight:600}
.linkbtn small{color:var(--muted);font-family:'Inter',sans-serif;direction:ltr;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.busy .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-banner{position:relative;z-index:2;width:100%;max-width:440px;background:#fff4d6;color:#7a5a00;border:1px solid #f0d78a;border-radius:12px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.card{padding:22px 16px}.two{grid-template-columns:1fr}.soc .soc-name{display:none}}
</style>
</head>
<body>

<svg class="net" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g stroke="#7aa2ff" stroke-width="1" opacity=".55" fill="none">
    <line x1="620" y1="60" x2="720" y2="150"/><line x1="720" y1="150" x2="680" y2="260"/>
    <line x1="620" y1="60" x2="540" y2="130"/><line x1="720" y1="150" x2="790" y2="90"/>
    <line x1="120" y1="440" x2="200" y2="520"/><line x1="200" y1="520" x2="90" y2="580"/>
  </g>
  <g fill="#5b8cff" opacity=".7">
    <circle cx="620" cy="60" r="5"/><circle cx="720" cy="150" r="9"/><circle cx="680" cy="260" r="4"/>
    <circle cx="540" cy="130" r="4"/><circle cx="790" cy="90" r="4"/><circle cx="120" cy="440" r="5"/>
    <circle cx="200" cy="520" r="8"/><circle cx="90" cy="580" r="4"/>
  </g>
</svg>

<div class="topbar">
  <button class="chip" id="langBtn" type="button">English</button>
</div>
<div class="demo-banner" id="demoBanner" data-i18n="demoBanner"></div>

<main class="card">

  <!-- ============ تسجيل الدخول ============ -->
  <section class="view active" id="view-login" aria-labelledby="loginTitle">
    <div class="brand"><svg viewBox="0 0 48 48"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f80ff"/><stop offset="1" stop-color="#0a2a7a"/></linearGradient></defs><path d="M38 12A18 18 0 1 0 38 36" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/></svg><b>Abu al-Fadl NFC</b></div>
    <h1 id="loginTitle" data-i18n="signIn"></h1>
    <p class="sub" data-i18n="signInSub"></p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="lUser" data-i18n="username"></label>
        <div class="inp has-ic"><span class="ic" data-ic="at"></span><input id="lUser" type="text" dir="ltr" autocomplete="username" maxlength="30" placeholder="your_username"></div>
      </div>
      <div class="field">
        <label for="lPass" data-i18n="password"></label>
        <div class="inp pw has-ic"><span class="ic" data-ic="lock"></span><input id="lPass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••"><button type="button" class="icon-btn" data-eye="lPass" aria-label="show/hide" data-ic="eye"></button></div>
      </div>
      <div class="hint bad" id="lErr" role="alert"></div>
      <button class="btn primary" type="submit" id="lSubmit"><span class="spinner"></span><span data-i18n="login"></span></button>
    </form>
    <div class="or" data-i18n="or"></div>
    <div class="two">
      <button class="btn ghost" type="button" data-social="Google">Continue with Google</button>
      <button class="btn ghost" type="button" data-social="Facebook">Continue with Facebook</button>
    </div>
    <div class="links">
      <button class="lnk" type="button" data-go="forgot" data-i18n="forgot"></button>
      <span><span data-i18n="newHere"></span> <button class="lnk" type="button" data-go="signup" data-i18n="signUp"></button></span>
    </div>
  </section>

  <!-- ============ إنشاء حساب - الخطوة 1 ============ -->
  <section class="view" id="view-signup">
    <div class="brand"><svg viewBox="0 0 48 48"><path d="M38 12A18 18 0 1 0 38 36" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/></svg><b>Abu al-Fadl NFC</b></div>
    <h1 data-i18n="createAccount"></h1>
    <p class="sub" data-i18n="signupSub"></p>
    <div class="steps"><i class="on"></i><i></i></div>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="sName" data-i18n="fullName"></label>
        <div class="inp has-ic"><span class="ic" data-ic="user"></span><input id="sName" type="text" autocomplete="name" maxlength="100" data-i18n-ph="fullNamePh"></div>
      </div>
      <div class="field">
        <label for="sUser" data-i18n="username"></label>
        <div class="row">
          <div class="inp has-ic"><span class="ic" data-ic="at"></span><input id="sUser" type="text" dir="ltr" maxlength="30" autocomplete="username" placeholder="your_username"></div>
          <button class="btn soft small" type="button" id="sCheck" data-i18n="checkAvail"></button>
        </div>
        <div class="hint" id="sUserHint"></div>
      </div>
      <div class="field">
        <label for="sEmail" data-i18n="email"></label>
        <div class="row">
          <div class="inp has-ic"><span class="ic" data-ic="mail"></span><input id="sEmail" type="email" dir="ltr" autocomplete="email" placeholder="janedoe@gmail.com"></div>
          <button class="btn soft small" type="button" id="sSend" data-i18n="sendCode"></button>
        </div>
      </div>
      <div class="field">
        <label for="sCode" data-i18n="code"></label>
        <div class="row">
          <div class="inp has-ic"><span class="ic" data-ic="shield"></span><input id="sCode" type="text" dir="ltr" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></div>
          <button class="btn soft small" type="button" id="sVerify" data-i18n="verify"></button>
        </div>
        <div class="hint" id="sCodeHint"><span id="sTimer"></span></div>
      </div>
      <div class="field">
        <label for="sPass" data-i18n="password"></label>
        <div class="inp pw has-ic"><span class="ic" data-ic="lock"></span><input id="sPass" type="password" dir="ltr" autocomplete="new-password" maxlength="64" placeholder="Min 8 characters"><button type="button" class="icon-btn" data-eye="sPass" aria-label="show/hide" data-ic="eye"></button></div>
        <div class="hint" id="sPassHint" data-i18n="passRule"></div>
      </div>
      <div class="field">
        <label for="sPass2" data-i18n="confirmPassword"></label>
        <div class="inp pw has-ic"><span class="ic" data-ic="lock"></span><input id="sPass2" type="password" dir="ltr" autocomplete="new-password" maxlength="64" placeholder="••••••••"><button type="button" class="icon-btn" data-eye="sPass2" aria-label="show/hide" data-ic="eye"></button></div>
      </div>
      <div class="hint bad" id="sErr" role="alert"></div>
      <button class="btn primary" type="submit"><span data-i18n="next"></span></button>
    </form>
    <div class="links" style="justify-content:center">
      <span><span data-i18n="haveAcct"></span> <button class="lnk" type="button" data-go="login" data-i18n="signIn"></button></span>
    </div>
  </section>

  <!-- ============ إعداد الملف الشخصي - الخطوة 2 ============ -->
  <section class="view" id="view-profile">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <h1 data-i18n="setupProfile"></h1>
    <p class="sub" data-i18n="setupSub"></p>
    <form id="profileForm" novalidate>
      <div class="avatar-wrap">
        <div class="avatar" id="avatarBox" tabindex="0" role="button" aria-label="Upload photo">
          <svg viewBox="0 0 24 24" fill="currentColor" id="avatarPh"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.4 4.2-7 8.5-7s7.9 2.6 8.5 7z"/></svg>
          <img id="avatarImg" alt="">
          <span class="avatar-plus">+</span>
        </div>
        <button class="up" type="button" id="avatarBtn" data-i18n="uploadPhoto"></button>
        <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" hidden>
      </div>

      <div class="field">
        <label for="pImgUrl" data-i18n="imageUrl"></label>
        <div class="inp has-ic"><span class="ic" data-ic="image"></span><input id="pImgUrl" type="url" dir="ltr" placeholder="https://i.ibb.co/jane.jpg"></div>
      </div>
      <div class="field">
        <label for="pImgShort" data-i18n="imageShortcut"></label>
        <div class="file-row">
          <div class="inp has-ic" style="flex:1"><span class="ic" data-ic="image"></span><input id="pImgShort" type="text" dir="ltr" readonly placeholder="—"></div>
          <button class="btn soft small" type="button" id="browseBtn" data-i18n="browse"></button>
        </div>
      </div>

      <div class="two">
        <div class="field">
          <label for="pPhone" data-i18n="phone"></label>
          <div class="inp has-ic"><span class="ic" data-ic="phone"></span><input id="pPhone" type="tel" dir="ltr" autocomplete="tel" placeholder="+201234567890"></div>
        </div>
        <div class="field">
          <label for="pCall" data-i18n="callPref"></label>
          <select id="pCall" class="plain">
            <option value="Call" data-i18n="optCall"></option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="SMS" data-i18n="optSms"></option>
            <option value="Email" data-i18n="optEmail"></option>
          </select>
        </div>
      </div>

      <h2 data-i18n="linkSocial"></h2>
      <p class="sub" style="text-align:start;margin-bottom:10px" data-i18n="linkSocialSub"></p>

      <div class="soc"><span class="badge" style="background:#1877f2">f</span><span class="soc-name">Facebook</span><input id="pFb" type="text" placeholder="facebook.com/username"></div>
      <div class="soc"><span class="badge" style="background:#25d366">WA</span><span class="soc-name">WhatsApp</span><input id="pWa" type="text" inputmode="tel" placeholder="+1234567890"></div>
      <div class="soc"><span class="badge" style="background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)">IG</span><span class="soc-name">Instagram</span><input id="pIg" type="text" placeholder="@your_instagram"></div>
      <div class="soc"><span class="badge" style="background:#000">X</span><span class="soc-name">Twitter / X</span><input id="pTw" type="text" placeholder="@your_twitter"></div>
      <div class="soc"><span class="badge" style="background:#111">TT</span><span class="soc-name">TikTok</span><input id="pTt" type="text" placeholder="@your_tiktok"></div>
      <div class="soc"><span class="badge" style="background:#ea4335">@</span><span class="soc-name" data-i18n="sendEmail"></span><input id="pMail" type="email" placeholder="you@gmail.com"></div>

      <div id="othersBox"></div>
      <button class="btn soft" type="button" id="addOther" style="width:100%;margin-top:4px" data-i18n="addOther"></button>

      <div class="hint bad" id="pErr" role="alert" style="margin-top:10px"></div>
      <div class="two" style="margin-top:6px;grid-template-columns:1fr 2fr">
        <button class="btn ghost" type="button" id="pBack" data-i18n="back"></button>
        <button class="btn primary" type="submit" id="pSubmit"><span class="spinner"></span><span data-i18n="saveCreate"></span></button>
      </div>
    </form>
  </section>

  <!-- ============ نسيت كلمة المرور ============ -->
  <section class="view" id="view-forgot">
    <div class="brand"><svg viewBox="0 0 48 48"><path d="M38 12A18 18 0 1 0 38 36" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/></svg><b>Abu al-Fadl NFC</b></div>
    <h1 data-i18n="resetTitle"></h1>
    <p class="sub" data-i18n="resetSub"></p>
    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="fEmail" data-i18n="email"></label>
        <div class="row">
          <div class="inp has-ic"><span class="ic" data-ic="mail"></span><input id="fEmail" type="email" dir="ltr" placeholder="janedoe@gmail.com"></div>
          <button class="btn soft small" type="button" id="fSend" data-i18n="sendCode"></button>
        </div>
      </div>
      <div class="field">
        <label for="fCode" data-i18n="code"></label>
        <div class="row">
          <div class="inp has-ic"><span class="ic" data-ic="shield"></span><input id="fCode" type="text" dir="ltr" inputmode="numeric" maxlength="6" placeholder="123456"></div>
          <span class="resend" id="fTimer"></span>
        </div>
      </div>
      <div class="field">
        <label for="fPass" data-i18n="newPassword"></label>

/* ========================= أدوات ========================= */
const $ = id => document.getElementById(id);
const PASS_RE = /^[\x21-\x7E]{8,64}$/;           // إنجليزي فقط، بدون مسافات، 8 على الأقل
const USER_RE = /^[a-z0-9_.]{3,30}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const cleanEmail = v => String(v || '').trim().toLowerCase();
const cleanUser = v => String(v || '').trim().replace(/^@/, '').toLowerCase();
const emailOk = v => EMAIL_RE.test(v) && (!CONFIG.REQUIRE_GMAIL || /@(gmail|googlemail)\.com$/.test(v));

function toast(msg, kind){
  const el = document.createElement('div');

  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
function setHint(el, msg, kind){ el.textContent = msg || ''; el.className = 'hint' + (kind ? ' ' + kind : ''); }
function setBusy(btn, on){ btn.classList.toggle('busy', on); btn.disabled = on; }

/* ========================= الاتصال بالخادم / الوضع التجريبي ========================= */
async function api(action, payload){
  if (!CONFIG.API_URL) return demoApi(action, payload);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // يتجنب preflight مع Apps Script
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'NETWORK' };
  }
}
function errMsg(code){ return t('e_' + code) === 'e_' + code ? t('e_GENERIC') : t('e_' + code); }

/* --- وضع تجريبي (localStorage) --- */
const demo = {
  db(){ try { return JSON.parse(localStorage.getItem('demo_users') || '[]'); } catch(e){ return []; } },
  save(list){ localStorage.setItem('demo_users', JSON.stringify(list)); },
  codes: {}, verified: {}
};
function demoApi(action, p){
  const email = cleanEmail(p.email);
  const users = demo.db();
  switch(action){
    case 'checkUsername': {
      const u = cleanUser(p.username);
      return { ok:true, available: USER_RE.test(u) && !users.some(x => x.username === u) };
    }
    case 'sendCode': {
      const exists = users.some(x => x.email === email);
      if (p.purpose === 'signup' && exists) return { ok:false, error:'EMAIL_EXISTS' };
      const code = String(Math.floor(100000 + Math.random() * 900000));
      demo.codes[email] = { code: code, exp: Date.now() + 120000 }; delete demo.verified[email];
      toast(t('demoCode') + code, 'ok');
      return { ok:true, sent:true };
    }
    case 'verifyCode': {
      const c = demo.codes[email];
      if (!c || Date.now() > c.exp) return { ok:false, error:'CODE_EXPIRED' };
      if (c.code !== String(p.code).trim()) return { ok:false, error:'INVALID_CODE' };
      demo.verified[email] = true; return { ok:true, verified:true };
    }
    case 'register': {
      if (!demo.verified[email]) return { ok:false, error:'EMAIL_NOT_VERIFIED' };
      const u = cleanUser(p.username);
      if (users.some(x => x.email === email)) return { ok:false, error:'EMAIL_EXISTS' };
      if (users.some(x => x.username === u)) return { ok:false, error:'USERNAME_TAKEN' };
      const profile = { fullName:p.fullName, username:u, email, imageUrl:p.imageBase64 || p.imageUrl || '',
        imageShortcut:p.imageShortcut || '', phone:p.phone, callPreference:p.callPreference, links:p.links };
      users.push(Object.assign({ password:p.password }, profile)); demo.save(users);
      delete demo.verified[email];
      return { ok:true, profile };
    }
    case 'login': {
      const u = users.find(x => x.username === cleanUser(p.username));
      if (!u || u.password !== p.password) return { ok:false, error:'INVALID_CREDENTIALS' };
      const copy = Object.assign({}, u); delete copy.password;
      return { ok:true, profile: copy };
    }
    case 'resetPassword': {
      const u = users.find(x => x.email === email);
      const c = demo.codes[email];
      if (!u || !c || Date.now() > c.exp || c.code !== String(p.code).trim()) return { ok:false, error:'INVALID_CODE' };
      u.password = p.newPassword; demo.save(users); delete demo.codes[email];
      return { ok:true };
    }
  }
  return { ok:false, error:'UNKNOWN_ACTION' };
}

/* ========================= المؤقّت لإعادة الإرسال ========================= */
const timers = {};
function startCooldown(btn, labelEl, key){
  let left = CONFIG.RESEND_SECONDS;
  btn.disabled = true;
  clearInterval(timers[key]);
  const tick = () => {
    if (labelEl) labelEl.textContent = t('resendIn') + left + t('secs');
    if (left-- <= 0){ clearInterval(timers[key]); btn.disabled = false; if (labelEl) labelEl.textContent = ''; }
  };
  tick();
  timers[key] = setInterval(tick, 1000);
}
async function requestCode({ emailInput, btn, timerEl, key, purpose, hintEl }){
  const email = cleanEmail(emailInput.value);
  if (!emailOk(email)){ emailInput.classList.add('err'); (hintEl || $('sErr')).textContent = t('errEmail'); return false; }
  emailInput.classList.remove('err');
  if (hintEl) setHint(hintEl, '');
  setBusy(btn, true);
  const r = await api('sendCode', { email, purpose });
  setBusy(btn, false);
  if (!r.ok){ toast(errMsg(r.error), 'bad'); return false; }
  toast(purpose === 'signup' ? t('codeSent') : t('resetSentGeneric'), 'ok');
  startCooldown(btn, timerEl, key);
  return true;
}

  const username = cleanUser($('lUser').value), password = $('lPass').value;

  if (!username || !password) return setHint($('lErr'), t('errFill'), 'bad');
  setBusy($('lSubmit'), true);
  const r = await api('login', { username, password });
  setBusy($('lSubmit'), false);
  if (!r.ok) return setHint($('lErr'), errMsg(r.error), 'bad');
  sessionStorage.setItem('profile', JSON.stringify(r.profile));
  $('loginForm').reset();
  renderCard(r.profile); show('card'); toast(t('welcome'), 'ok');
});

/* ========================= إنشاء حساب - الخطوة 1 ========================= */
const signup = { verified:false, verifiedEmail:'', userOk:false, checkedUser:'' };

async function checkUsernameNow(){
  const u = cleanUser($('sUser').value);
  if (!USER_RE.test(u)){ signup.userOk = false; setHint($('sUserHint'), t('userInvalid'), 'bad'); return false; }
  setBusy($('sCheck'), true);
  const r = await api('checkUsername', { username: u });
  setBusy($('sCheck'), false);
  if (!r.ok){ setHint($('sUserHint'), errMsg(r.error), 'bad'); return false; }
  signup.userOk = !!r.available; signup.checkedUser = u;
  setHint($('sUserHint'), r.available ? t('userFree') : t('userTaken'), r.available ? 'ok' : 'bad');
  return signup.userOk;
}
$('sCheck').addEventListener('click', checkUsernameNow);
let userDebounce;
$('sUser').addEventListener('input', () => {
  signup.userOk = false; setHint($('sUserHint'), '');
  clearTimeout(userDebounce);
  const u = cleanUser($('sUser').value);
  if (u.length >= 3) userDebounce = setTimeout(checkUsernameNow, 700);
});
$('sEmail').addEventListener('input', () => { signup.verified = false; setHint($('sCodeHint'), ''); });
$('sSend').addEventListener('click', () => requestCode({ emailInput:$('sEmail'), btn:$('sSend'), timerEl:$('sTimer'), key:'s', purpose:'signup', hintEl:$('sErr') }));
$('sVerify').addEventListener('click', async () => {
  const email = cleanEmail($('sEmail').value), code = $('sCode').value.trim();
  if (!emailOk(email)) return setHint($('sErr'), t('errEmail'), 'bad');
  if (!/^\d{6}$/.test(code)) return setHint($('sCodeHint'), t('errCode'), 'bad');
  setBusy($('sVerify'), true);
  const r = await api('verifyCode', { email, code });
  setBusy($('sVerify'), false);
  if (!r.ok) return setHint($('sCodeHint'), errMsg(r.error), 'bad');
  signup.verified = true; signup.verifiedEmail = email;
  setHint($('sCodeHint'), t('verified'), 'ok'); setHint($('sErr'), '');
});
$('signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('sName').value.trim(), user = cleanUser($('sUser').value), email = cleanEmail($('sEmail').value);
  const p1 = $('sPass').value, p2 = $('sPass2').value, err = $('sErr');
  setHint(err, '');
  if (!name) return setHint(err, t('errName'), 'bad');
  if (!USER_RE.test(user)) return setHint(err, t('errUser'), 'bad');
  if (!signup.userOk || signup.checkedUser !== user){
    const ok = await checkUsernameNow();
    if (!ok) return setHint(err, t('errUserTaken'), 'bad');
  }
  if (!emailOk(email)) return setHint(err, t('errEmail'), 'bad');
  if (!signup.verified || signup.verifiedEmail !== email) return setHint(err, t('errCodeVerify'), 'bad');
  if (!PASS_RE.test(p1)) return setHint(err, t('errPass'), 'bad');
  if (p1 !== p2) return setHint(err, t('errPassMatch'), 'bad');
  signup.data = { fullName:name, username:user, email, password:p1 };
  show('profile');
});

/* ========================= الخطوة 2: الملف الشخصي ========================= */
let avatarData = '';       // صورة مصغّرة base64
$('avatarBtn').addEventListener('click', () => $('avatarFile').click());
$('browseBtn').addEventListener('click', () => $('avatarFile').click());
$('avatarBox').addEventListener('click', () => $('avatarFile').click());
$('avatarBox').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('avatarFile').click(); } });

$('avatarFile').addEventListener('change', async () => {
  const f = $('avatarFile').files[0];
  if (!f) return;
  setHint($('pErr'), '');
  if (!/^image\/(png|jpe?g|webp)$/.test(f.type)) return setHint($('pErr'), t('errImgType'), 'bad');
  if (f.size > 8 * 1024 * 1024) return setHint($('pErr'), t('errImgBig'), 'bad');
  try {
    avatarData = await resizeImage(f, 400);
    $('avatarImg').src = avatarData; $('avatarImg').style.display = 'block'; $('avatarPh').style.display = 'none';
    $('pImgShort').value = f.name;                 // اختصار الصورة (اسم الملف)
  } catch (e) { setHint($('pErr'), t('errImgType'), 'bad'); }
});
function resizeImage(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const ctx = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
$('pImgUrl').addEventListener('input', () => {
  const v = $('pImgUrl').value.trim();
  if (/^https?:\/\//i.test(v) && !avatarData){
    $('avatarImg').src = v; $('avatarImg').style.display = 'block'; $('avatarPh').style.display = 'none';
  }
});
$('avatarImg').addEventListener('error', () => { if (!avatarData){ $('avatarImg').style.display = 'none'; $('avatarPh').style.display = ''; } });

/* منصات أخرى */
function addOtherRow(name, url){
  const row = document.createElement('div'); row.className = 'other-row';
  const n = document.createElement('input'); n.className = 'o-name'; n.type = 'text'; n.maxLength = 40; n.placeholder = t('otherName'); n.value = name || '';
  const u = document.createElement('input'); u.className = 'o-url'; u.type = 'text'; u.maxLength = 300; u.placeholder = t('otherUrl'); u.value = url || '';
  const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'remove');
  x.addEventListener('click', () => row.remove());
  row.append(n, u, x); $('othersBox').appendChild(row);
}
$('addOther').addEventListener('click', () => { if ($('othersBox').children.length < 10) addOtherRow(); });
$('pBack').addEventListener('click', () => show('signup'));

/* تحويل المدخلات إلى روابط صحيحة */
function normUrl(v, base){
  v = String(v || '').trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^(www\.)?[a-z0-9-]+\.[a-z]{2,}\//i.test(v)) return 'https://' + v;
  return base ? base + v.replace(/^@/, '') : 'https://' + v;
}
function buildLinks(){
  const wa = $('pWa').value.replace(/[^\d+]/g, '').replace(/^\+/, '');
  const mail = $('pMail').value.trim();
  const others = [...document.querySelectorAll('#othersBox .other-row')].map(r => ({
    name: r.querySelector('.o-name').value.trim(),
    url: normUrl(r.querySelector('.o-url').value)
  })).filter(o => o.name && o.url);
  return {
    facebook: normUrl($('pFb').value, 'https://facebook.com/'),
    instagram: normUrl($('pIg').value, 'https://instagram.com/'),
    twitter: normUrl($('pTw').value, 'https://x.com/'),
    tiktok: normUrl($('pTt').value, 'https://tiktok.com/@'),
    whatsapp: wa ? 'https://wa.me/' + wa : '',
    emailLink: mail && EMAIL_RE.test(mail) ? 'mailto:' + mail : '',
    others
  };
}

$('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('pErr'); setHint(err, '');
  if (!signup.data) return show('signup');
  const imgUrl = $('pImgUrl').value.trim();
  if (imgUrl && !/^https?:\/\//i.test(imgUrl)) return setHint(err, t('errUrl'), 'bad');
  const phone = $('pPhone').value.trim();
  if (phone && !/^\+?[\d\s\-()]{7,20}$/.test(phone)) return setHint(err, t('errPhone'), 'bad');
  const mail = $('pMail').value.trim();
  if (mail && !EMAIL_RE.test(mail)) return setHint(err, t('errEmail'), 'bad');

  setBusy($('pSubmit'), true);
  const r = await api('register', Object.assign({}, signup.data, {
    imageUrl: imgUrl,
    imageShortcut: $('pImgShort').value.trim(),
    imageBase64: avatarData,
    phone,
    callPreference: $('pCall').value,
    links: buildLinks()
  }));
  setBusy($('pSubmit'), false);
  if (!r.ok){
    if (['EMAIL_NOT_VERIFIED','EMAIL_EXISTS'].includes(r.error)) show('signup');
    if (r.error === 'USERNAME_TAKEN') show('signup');
    return setHint(err, errMsg(r.error), 'bad');
  }
  toast(CONFIG.API_URL ? t('saved') : t('savedDemo'), 'ok');
  sessionStorage.setItem('profile', JSON.stringify(r.profile));
  resetSignup();
  renderCard(r.profile); show('card');
});
function resetSignup(){
  $('signupForm').reset(); $('profileForm').reset(); $('othersBox').innerHTML = '';
  Object.assign(signup, { verified:false, verifiedEmail:'', userOk:false, checkedUser:'', data:null });
  avatarData = ''; $('avatarImg').style.display = 'none'; $('avatarImg').removeAttribute('src'); $('avatarPh').style.display = '';
  setHint($('sUserHint'), ''); setHint($('sCodeHint'), ''); setHint($('sErr'), '');
}

/* ========================= نسيت كلمة المرور ========================= */
$('fSend').addEventListener('click', () => requestCode({ emailInput:$('fEmail'), btn:$('fSend'), timerEl:$('fTimer'), key:'f', purpose:'reset', hintEl:$('fErr') }));
$('forgotForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = cleanEmail($('fEmail').value), code = $('fCode').value.trim(), np = $('fPass').value;
  setHint($('fErr'), '');
  if (!emailOk(email)) return setHint($('fErr'), t('errEmail'), 'bad');

  if (!PASS_RE.test(np)) return setHint($('fErr'), t('errPass'), 'bad');

/* ========================= البطاقة التعريفية ========================= */
const BRAND = {
  facebook:{ label:'Facebook', bg:'#1877f2', g:'f' },
  instagram:{ label:'Instagram', bg:'linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)', g:'IG' },
  twitter:{ label:'Twitter / X', bg:'#000', g:'X' },
  tiktok:{ label:'TikTok', bg:'#111', g:'TT' },
  whatsapp:{ label:'WhatsApp', bg:'#25d366', g:'WA' },
  emailLink:{ label:'Email', bg:'#ea4335', g:'@' },
  phone:{ label:'Call', bg:'#0b5fff', g:'☎' }
};
function safeHref(u){ return /^(https?:|mailto:|tel:)/i.test(u) ? u : ''; }
function linkButton(kind, label, href, shown){
  const a = document.createElement('a');
  a.className = 'linkbtn'; a.href = href; a.rel = 'noopener noreferrer';
  if (/^https?:/i.test(href)) a.target = '_blank';
  const b = document.createElement('span'); b.className = 'badge'; b.style.background = kind.bg; b.textContent = kind.g;
  const tt = document.createElement('span'); tt.className = 't'; tt.textContent = label;
  const s = document.createElement('small'); s.textContent = shown || '';
  a.append(b, tt, s); return a;
}
function renderCard(p){
  $('cName').textContent = p.fullName || '';
  $('cUser').textContent = '@' + (p.username || '');
  const img = $('cImg');
  if (p.imageUrl && /^(https?:|data:image\/)/i.test(p.imageUrl)){
    img.src = p.imageUrl; img.style.display = 'block'; $('cPh').style.display = 'none';
    img.onerror = () => { img.style.display = 'none'; $('cPh').style.display = ''; };
  } else { img.style.display = 'none'; $('cPh').style.display = ''; }

  const box = $('cLinks'); box.innerHTML = '';
  const L = p.links || {};
  let count = 0;
  ['facebook','instagram','twitter','tiktok','whatsapp'].forEach(k => {
    const h = safeHref(L[k]); if (!h) return;
    box.appendChild(linkButton(BRAND[k], BRAND[k].label, h, h.replace(/^https?:\/\/(www\.)?/, ''))); count++;
  });
  if (p.phone){
    const num = String(p.phone).replace(/[^\d+]/g, '');
    const pref = p.callPreference || 'Call';
    let href = 'tel:' + num, label = BRAND.phone.label;
    if (pref === 'WhatsApp'){ href = 'https://wa.me/' + num.replace(/^\+/, ''); label = 'WhatsApp'; }
    else if (pref === 'SMS'){ href = 'sms:' + num; label = 'SMS'; }
    else if (pref === 'Email' && p.email){ href = 'mailto:' + p.email; label = 'Email'; }
    box.appendChild(linkButton(BRAND.phone, label, href, p.phone)); count++;
  }
  const mh = safeHref(L.emailLink);
  if (mh){ box.appendChild(linkButton(BRAND.emailLink, BRAND.emailLink.label, mh, mh.replace('mailto:', ''))); count++; }
  (L.others || []).forEach(o => {
    const h = safeHref(o.url); if (!h) return;
    const k = { bg:'#5b6b8f', g: (o.name || '?').charAt(0).toUpperCase() };
    box.appendChild(linkButton(k, o.name, h, h.replace(/^https?:\/\/(www\.)?/, ''))); count++;
  });
  $('cEmpty').style.display = count ? 'none' : 'block';
}
$('copyBtn').addEventListener('click', async () => {
  const p = JSON.parse(sessionStorage.getItem('profile') || '{}');
  const lines = [p.fullName, '@' + p.username, p.email, p.phone];
  const L = p.links || {};
  ['facebook','instagram','twitter','tiktok','whatsapp'].forEach(k => { if (L[k]) lines.push(L[k]); });
  (L.others || []).forEach(o => lines.push(o.name + ': ' + o.url));
  try { await navigator.clipboard.writeText(lines.filter(Boolean).join('\n')); toast(t('copied'), 'ok'); }
  catch(e){ toast(t('e_GENERIC'), 'bad'); }
});
$('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('profile'); show('login'); });

    const p = JSON.parse(sessionStorage.getItem('profile') || 'null');
