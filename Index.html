<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<title>Abo El-Fadl NFC - الملف الشخصي والبطاقة التعريفية الإلكترونية</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b5fff; --blue-dark:#0a3fae; --navy:#0e1b3d; --ink:#1b2a4a; --muted:#6b7794;
  --line:#d9e1f2; --bg1:#eaf1ff; --bg2:#f3eeff; --card:rgba(255,255,255,.92);
  --ok:#12a150; --err:#d92d3a; --field:#ffffff; --shadow:0 20px 50px rgba(20,50,120,.16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --ink:#e8eefc; --muted:#9aa8c9; --line:#2b3a63; --bg1:#0b1430; --bg2:#141033;
    --card:rgba(20,30,62,.92); --field:#101b3b; --navy:#e8eefc; --shadow:0 20px 50px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
/* الوضع الليلي المختار يدوياً - هوية NFC: كحلي عميق مع أزرق مضيء */
:root[data-theme="dark"]{
  --blue:#3d7dff; --blue-dark:#2f6ae0; --navy:#e8eefc; --ink:#e9effd; --muted:#8f9dc4;
  --line:#26365e; --bg1:#060f24; --bg2:#0c1133; --card:rgba(14,24,52,.94);
  --field:#101c3e; --ok:#2fbf71; --err:#ff6b74;
  --shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(61,125,255,.08);
  color-scheme: dark;
}
#themeBtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;padding:0}
#themeBtn svg{width:17px;height:17px;display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:'Cairo','Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:var(--ink); background:linear-gradient(135deg,var(--bg1),var(--bg2)); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 14px 40px;
  position:relative; overflow-x:hidden;
}
html[lang="en"] body{font-family:'Inter','Cairo',system-ui,sans-serif}
.net{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.topbar{position:relative;z-index:2;width:100%;max-width:440px;display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.icon-btn:focus-visible{outline:3px solid rgba(11,95,255,.45);outline-offset:2px}
.card{
  position:relative;z-index:1;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.view{display:none}.view.active{display:block}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.brand svg{width:38px;height:38px}
.brand b{font-family:'Inter',sans-serif;font-size:22px;color:var(--navy);letter-spacing:-.5px}
h1{font-size:19px;text-align:center;margin-bottom:4px;color:var(--ink)}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
.field{margin-bottom:13px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink)}
.inp{position:relative;display:flex;align-items:center;gap:6px}
.inp .ic{position:absolute;inset-inline-start:11px;color:var(--muted);display:flex;pointer-events:none}
.inp .ic svg{width:17px;height:17px}
input,select{
  width:100%;height:44px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);color:var(--ink);
  font:inherit;font-size:14px;padding-inline:38px 12px;transition:border-color .15s, box-shadow .15s;
}
input.plain,select.plain{padding-inline:12px}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,95,255,.14);outline:none}
input[dir="ltr"],.ltr{direction:ltr;text-align:left}
html[dir="rtl"] input[dir="ltr"]{padding-inline:12px 38px}
.inp.has-ic input[dir="ltr"]{padding-left:38px;padding-right:12px}
html[dir="rtl"] .inp.has-ic input[dir="ltr"]{padding-left:12px;padding-right:12px}
.inp.pw.has-ic input[dir="ltr"]{padding-right:44px}
html[dir="rtl"] .inp.pw.has-ic input[dir="ltr"]{padding-left:44px;padding-right:12px}
.inp input.err,.inp select.err{border-color:var(--err)}
.icon-btn{position:absolute;inset-inline-end:8px;background:none;border:0;cursor:pointer;color:var(--muted);display:flex;padding:6px;border-radius:8px}
.icon-btn svg{width:18px;height:18px}
.inp.pw input{padding-inline-end:42px}
.btn{
  height:44px;border:0;border-radius:11px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, background .15s, opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--blue);color:#fff;width:100%}
.btn.primary:hover:not([disabled]){background:var(--blue-dark)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);width:100%}
.btn.soft{background:rgba(11,95,255,.1);color:var(--blue);white-space:nowrap}
.btn.small{height:44px;padding:0 14px;font-size:13px}
.row{display:flex;gap:8px;align-items:stretch}
.row .inp{flex:1}
.hint{font-size:12px;margin-top:5px;min-height:16px;color:var(--muted)}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--err)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:14px;flex-wrap:wrap}
a,.lnk{color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:0;font:inherit;font-size:13px}
.lnk:hover{text-decoration:underline}
.resend{font-size:12px;color:var(--muted);white-space:nowrap;padding-inline:10px;display:flex;align-items:center}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--blue)}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:16px}
.avatar{position:relative;width:104px;height:104px;border-radius:50%;border:3px solid var(--blue);background:#dfe6f5;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.avatar svg{width:56px;height:56px;color:#9aa6c3}
.avatar-plus{position:absolute;bottom:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}
.avatar-wrap .up{font-size:13px;color:var(--blue);margin-top:8px;cursor:pointer;background:none;border:0;font-family:inherit}
h2{font-size:16px;margin:18px 0 4px}
.lrow{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.lrow .badge{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;font:700 12px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.badge.img{border-radius:9px;background:transparent}
.badge img{width:100%;height:100%;object-fit:contain;display:block}
.lrow .soc-name{flex:0 0 76px;font-size:13px;font-weight:600}
.lrow input{height:40px;padding-inline:12px;font-size:13px;direction:ltr;text-align:left;min-width:0}
.lrow.custom input.o-name{flex:1 1 0;padding-inline:10px}
.lrow.custom input.o-url{flex:1.6 1 0;padding-inline:10px}
.lrow input.flex{flex:1 1 0}
.lrow .note{flex:1;font-size:12px;color:var(--muted);line-height:1.4}
.lrow .mv{flex:0 0 28px;display:flex;flex-direction:column;gap:3px}
.lrow .mv button{height:18.5px;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:6px;cursor:pointer;font-size:9px;line-height:1;padding:0}
.lrow .mv button:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.lrow .mv button[disabled]{opacity:.35;cursor:default}
.lrow .act{flex:0 0 34px;height:40px;border:0;border-radius:10px;cursor:pointer;font-size:18px;line-height:1}
.lrow .act.add{background:rgba(11,95,255,.1);color:var(--blue)}
.lrow .act.del{background:rgba(217,45,58,.1);color:var(--err)}
.lrow .act-ph{flex:0 0 34px}
.lrow.flash{animation:lflash .5s ease}
@keyframes lflash{from{background:rgba(11,95,255,.16)}to{background:transparent}}
.lrow.phonerow{padding:6px 0}
.order-hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.file-row{display:flex;gap:8px}
.file-row input[type=text]{flex:1}
.toast-box{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none;padding:0 14px}
.toast{background:#101a36;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.ok{background:#0c7a3d}.toast.bad{background:#b3202c}
/* البطاقة التعريفية */
.idcard{text-align:center}
.idcard .avatar{cursor:default;width:120px;height:120px;margin:4px auto 12px}
/* صورة الغلاف - تصميم فيسبوك */
.coverbox{position:relative;height:110px;border:2px dashed var(--line);border-radius:12px;background:var(--field);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.coverbox:hover{border-color:var(--blue)}
.coverbox img{width:100%;height:100%;object-fit:cover;display:none}
.coverbox .coverbox-plus{font-size:26px;color:var(--muted);pointer-events:none}
.idcard .cover{position:relative;height:150px;margin:-28px -24px 0;border-radius:19px 19px 0 0;overflow:hidden;background:linear-gradient(135deg,var(--blue),#7b2ff7)}
.idcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:13px;font-weight:600}
.idcard .cAva{position:relative;z-index:2;margin:-42px auto 10px;border:4px solid #fff;box-shadow:0 6px 16px rgba(10,30,80,.25);background:var(--field)}
.idcard h1{font-size:21px;margin-bottom:0}
.idcard .un{color:var(--muted);direction:ltr;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:16px}
.linklist{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.linkbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--field)}
.linkbtn:hover{border-color:var(--blue)}
.linkbtn .badge{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;font:700 11px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
.linkbtn span.t{flex:1;text-align:center;font-size:14px;font-weight:600}
.linkbtn small{color:var(--muted);font-family:'Inter',sans-serif;direction:ltr;max-width:0;opacity:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:max-width .25s ease,opacity .2s ease}
.linkbtn:hover small,.linkbtn:active small,.linkbtn:focus-visible small{max-width:150px;opacity:1}
.linkbtn.grpbtn{width:100%;font:inherit;cursor:pointer;text-align:start}
.linkbtn .cnt{flex:0 0 auto;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--blue);color:#fff;font:700 12px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:3px}
.linkbtn .cnt::after{content:'\25BE';font-size:10px}
#groupPanel{align-items:center;z-index:110}
#groupPanel .feature-sheet{max-width:380px}
#groupPanel .linkbtn small{max-width:170px;opacity:1}
.sharebox{background:rgba(11,95,255,.07);border:1px dashed var(--blue);border-radius:14px;padding:12px;margin:0 0 16px;text-align:start}
.sharebox label{font-size:12.5px}
.sharebox input{padding-inline:12px;margin-bottom:8px;font-size:13px;height:40px;direction:ltr;text-align:left}
.sharebox .btn{height:40px;font-size:13px;text-decoration:none}
.bio{font-size:13.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.6}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.qrbox{display:block;width:120px;height:120px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:6px}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important;display:block;border-radius:6px}
.qrwrap span{font-size:11.5px;color:var(--muted)}
#createOwn{text-decoration:none;margin-top:18px}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.busy .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-banner{position:relative;z-index:2;width:100%;max-width:440px;background:#fff4d6;color:#7a5a00;border:1px solid #f0d78a;border-radius:12px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.card{padding:22px 16px}.two{grid-template-columns:1fr}.lrow .soc-name{display:none}.lrow .badge{flex-basis:30px;height:30px}}

/* ========================= مميزات Abo El-Fadl NFC الجديدة ========================= */
.feature-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.feature-tools .btn{width:100%;font-size:13px}
.feature-panel{position:fixed;inset:0;z-index:100;background:rgba(3,10,30,.62);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:12px}
.feature-panel.open{display:flex}
.feature-sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.feature-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.feature-head h2{margin:0;font-size:18px}
.feature-close{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-size:20px;cursor:pointer}
.feature-section{border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:10px;background:rgba(11,95,255,.035)}
.feature-section h3{font-size:14px;margin-bottom:8px}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feature-stat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--field)}
.feature-stat .num{margin-inline-start:auto;font-weight:800;color:var(--blue)}
.feature-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.feature-choice{display:flex;gap:8px;flex-wrap:wrap}
.feature-choice button{flex:1;min-width:105px}
.nfc-status{padding:10px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-size:13px;line-height:1.7}
.offline-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(11,95,255,.1);color:var(--blue);font-size:11px;font-weight:700;margin-bottom:8px}
[data-card-style="soft"] .idcard .cover{filter:saturate(.9)}
[data-card-style="minimal"] .idcard .cover{height:110px}
[data-card-style="minimal"] .idcard .linkbtn{border-radius:8px}
[data-card-accent="purple"]{--blue:#7c3aed;--blue-dark:#6d28d9}
[data-card-accent="green"]{--blue:#16a34a;--blue-dark:#15803d}
[data-card-accent="orange"]{--blue:#ea580c;--blue-dark:#c2410c}
@media(max-width:420px){.feature-grid{grid-template-columns:1fr}.feature-tools{grid-template-columns:1fr}}
.gbtn-wrap{display:flex;justify-content:center;align-items:center;min-height:44px;margin:4px 0;color-scheme:light}
.gwrap{width:100%}
#gModeNote{font-size:12.5px}
</style>
</head>
<body>

<svg class="net" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g stroke="#7aa2ff" stroke-width="1" opacity=".55" fill="none">
    <line x1="620" y1="60" x2="720" y2="150"/><line x1="720" y1="150" x2="680" y2="260"/>
    <line x1="620" y1="60" x2="540" y2="130"/><line x1="720" y1="150" x2="790" y2="90"/>
    <line x1="120" y1="440" x2="200" y2="520"/><line x1="200" y1="520" x2="90" y2="580"/>
  </g>
  <g fill="#5b8cff" opacity=".7">
    <circle cx="620" cy="60" r="5"/><circle cx="720" cy="150" r="9"/><circle cx="680" cy="260" r="4"/>
    <circle cx="540" cy="130" r="4"/><circle cx="790" cy="90" r="4"/><circle cx="120" cy="440" r="5"/>
    <circle cx="200" cy="520" r="8"/><circle cx="90" cy="580" r="4"/>
  </g>
</svg>

<div class="topbar">
  <button class="chip" id="themeBtn" type="button" aria-label="theme"><span id="themeIcon"></span></button>
  <button class="chip" id="langBtn" type="button">English</button>
</div>
<div class="demo-banner" id="demoBanner" data-i18n="demoBanner"></div>

<main class="card">

  <!-- ============ تسجيل الدخول ============ -->
  <section class="view active" id="view-login" aria-labelledby="loginTitle">
    <div class="brand"><svg viewBox="0 0 48 48"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f80ff"/><stop offset="1" stop-color="#0a2a7a"/></linearGradient></defs><path d="M38 12A18 18 0 1 0 38 36" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/></svg><b>Abo El-Fadl NFC</b></div>
    <h1 id="loginTitle" data-i18n="signIn"></h1>
    <p class="sub" data-i18n="signInSub"></p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="lUser" data-i18n="username"></label>
        <div class="inp has-ic"><span class="ic" data-ic="at"></span><input id="lUser" type="text" dir="ltr" autocomplete="username" maxlength="30" placeholder="your_username"></div>
      </div>
      <div class="field">
        <label for="lPass" data-i18n="password"></label>
        <div class="inp pw has-ic"><span class="ic" data-ic="lock"></span><input id="lPass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••"><button type="button" class="icon-btn" data-eye="lPass" aria-label="show/hide" data-ic="eye"></button></div>
      </div>
      <div class="hint bad" id="lErr" role="alert"></div>
      <button class="btn primary" type="submit" id="lSubmit"><span class="spinner"></span><span data-i18n="login"></span></button>
    </form>
    <div class="or" data-i18n="or"></div>
    <div class="gwrap" id="gLoginWrap"><div class="gbtn-wrap" id="gBtnLogin"></div></div>
    <div class="or" data-i18n="or"></div>
    <div class="two">
      <button class="btn ghost" type="button" id="facebookPageBtn">Page FACEBOOK</button>
      <button class="btn ghost" type="button" id="whatsappContactBtn">Contact us WhatsApp</button>
    </div>
    <button class="btn ghost" type="button" id="storeBtn" style="width:100%;margin-top:8px">
      🛍️ Visit Our Store
    </button>
    <div class="links">
      <button class="lnk" type="button" data-go="forgot" data-i18n="forgot"></button>
      <span><span data-i18n="newHere"></span> <button class="lnk" type="button" data-go="signup" data-i18n="signUp"></button></span>
    </div>
  </section>

  <!-- ============ إنشاء حساب - الخطوة 1 ============ -->
  <section class="view" id="view-signup">
    <div class="brand"><svg viewBox="0 0 48 48"><path d="M38 12A18 18 0 1 0 38 36" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/></svg><b>Abo El-Fadl NFC</b></div>
    <h1 data-i18n="createAccount"></h1>
    <p class="sub" data-i18n="signupSub"></p>

async function api(action, payload){
  if (!CONFIG.API_URL) return demoApi(action, payload);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // يتجنب preflight مع Apps Script
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'NETWORK' };
  }
}
async function apiGet(action, params){
  if (!CONFIG.API_URL) return demoGet(action, params);
  try {
    const qs = new URLSearchParams(Object.assign({ action }, params)).toString();
    const res = await fetch(CONFIG.API_URL + '?' + qs);
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'NETWORK' };
  }
}
function demoGet(action, p){
  if (action === 'profile'){
    const u = demo.db().find(x => x.username === cleanUser(p.username));
    if (!u) return { ok:false, error:'NOT_FOUND' };
    const c = Object.assign({}, u); delete c.password; delete c.email; delete c.imageShortcut;
    return { ok:true, profile:c };
  }
  return { ok:false, error:'UNKNOWN_ACTION' };
}
function errMsg(code){ return t('e_' + code) === 'e_' + code ? t('e_GENERIC') : t('e_' + code); }

/* --- وضع تجريبي (localStorage) --- */
const demo = {
  db(){ try { return JSON.parse(localStorage.getItem('demo_users') || '[]'); } catch(e){ return []; } },
  save(list){ localStorage.setItem('demo_users', JSON.stringify(list)); },
  codes: {}, verified: {}
};
function demoApi(action, p){
  const email = cleanEmail(p.email);
  const users = demo.db();
  switch(action){
    case 'checkUsername': {
      const u = cleanUser(p.username);
      return { ok:true, available: USER_RE.test(u) && !users.some(x => x.username === u) };
    }
    case 'sendCode': {
      if (p.purpose !== 'signup') return { ok:false, error:'CODE_FOR_SIGNUP_ONLY' };
      const exists = users.some(x => x.email === email);
      if (exists) return { ok:false, error:'EMAIL_EXISTS' };
      const code = String(Math.floor(100000 + Math.random() * 900000));
      demo.codes[email] = { code: code, exp: Date.now() + 120000 }; delete demo.verified[email];
      toast(t('demoCode') + code, 'ok');
      return { ok:true, sent:true };
    }
    case 'verifyCode': {
      const c = demo.codes[email];
      if (!c || Date.now() > c.exp) return { ok:false, error:'CODE_EXPIRED' };
      if (c.code !== String(p.code).trim()) return { ok:false, error:'INVALID_CODE' };
      demo.verified[email] = true; return { ok:true, verified:true };
    }
    case 'register': {
      if (!demo.verified[email]) return { ok:false, error:'EMAIL_NOT_VERIFIED' };
      const u = cleanUser(p.username);
      if (users.some(x => x.email === email)) return { ok:false, error:'EMAIL_EXISTS' };
      if (users.some(x => x.username === u)) return { ok:false, error:'USERNAME_TAKEN' };
      const profile = { fullName:p.fullName, username:u, email, imageUrl:p.imageBase64 || p.imageUrl || '', coverImageUrl:p.coverImageBase64 || p.coverImageUrl || '', bio:p.bio || '',
        imageShortcut:p.imageShortcut || '', phone:p.phone, callPreference:p.callPreference, links:p.links };
      users.push(Object.assign({ password:p.password }, profile)); demo.save(users);
      delete demo.verified[email];
      return { ok:true, profile };
    }
    case 'login': {
      const u = users.find(x => x.username === cleanUser(p.username));
      if (!u || u.password !== p.password) return { ok:false, error:'INVALID_CREDENTIALS' };
      const copy = Object.assign({}, u); delete copy.password;
      return { ok:true, profile: copy };
    }
    case 'updateProfile': {
      const u = users.find(x => x.username === cleanUser(p.username));
      if (!u || u.password !== p.password) return { ok:false, error:'INVALID_CREDENTIALS' };
      u.fullName = p.fullName || u.fullName;
      if (p.imageBase64) u.imageUrl = p.imageBase64; else if (p.imageUrl) u.imageUrl = p.imageUrl;
      if (p.coverImageBase64) u.coverImageUrl = p.coverImageBase64; else if (p.coverImageUrl) u.coverImageUrl = p.coverImageUrl;
      u.imageShortcut = p.imageShortcut || u.imageShortcut || '';
      u.phone = p.phone; u.callPreference = p.callPreference; u.links = p.links || u.links; u.bio = p.bio || u.bio || '';
      demo.save(users);
      const copy = Object.assign({}, u); delete copy.password;
      return { ok:true, profile: copy };
    }
    case 'forgotPassword': {
      const u = users.find(x => x.username === cleanUser(p.username));
      if (u) toast('Demo password: ' + u.password, 'ok');
      return { ok:true, sent:true };
    }
  }
  return { ok:false, error:'UNKNOWN_ACTION' };
}

/* ========================= المؤقّت لإعادة الإرسال ========================= */
const timers = {};
function startCooldown(btn, labelEl, key){
  let left = CONFIG.RESEND_SECONDS;
  btn.disabled = true;
  clearInterval(timers[key]);
  const tick = () => {
    if (labelEl) labelEl.textContent = t('resendIn') + left + t('secs');
    if (left-- <= 0){ clearInterval(timers[key]); btn.disabled = false; if (labelEl) labelEl.textContent = ''; }
  };
  tick();
  timers[key] = setInterval(tick, 1000);
}
async function requestCode({ emailInput, btn, timerEl, key, purpose, hintEl }){
  const email = cleanEmail(emailInput.value);
  if (!emailOk(email)){ emailInput.classList.add('err'); (hintEl || $('sErr')).textContent = t('errEmail'); return false; }
  emailInput.classList.remove('err');
  if (hintEl) setHint(hintEl, '');
  setBusy(btn, true);
  const r = await api('sendCode', { email, purpose });
  setBusy(btn, false);
  if (!r.ok){ toast(errMsg(r.error), 'bad'); return false; }
  toast(purpose === 'signup' ? t('codeSent') : t('resetSentGeneric'), 'ok');
  startCooldown(btn, timerEl, key);
  return true;
}

function resizeImage(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const ctx = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

  if (f.size > 8 * 1024 * 1024) return setHint($('pErr'), t('errImgBig'), 'bad');
  try {
    coverData = await resizeCover(f, 1200);
    $('pCoverImg').src = coverData; $('pCoverImg').style.display = 'block';
  } catch (e) { setHint($('pErr'), t('errImgType'), 'bad'); }
});
function resizeCover(file, maxW){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

const ORDER_KEY = '__order__';

// التعرف على المنصة من الاسم (أو من رابط الموقع)
const NAME_ALIASES = {
  facebook:['facebook','fb','face','فيسبوك','فيس بوك','فيس'],
  instagram:['instagram','insta','ig','انستجرام','انستغرام','إنستجرام','انستا'],
  twitter:['twitter','x','twitterx','xtwitter','تويتر','اكس','إكس'],
  tiktok:['tiktok','tik tok','تيكتوك','تيك توك'],
  whatsapp:['whatsapp','whats app','wa','واتساب','واتس اب','واتس','وتساب'],
  emailLink:['email','e-mail','mail','gmail','ايميل','إيميل','بريد','البريد','البريد الالكتروني','البريد الإلكتروني','sendemail'],
  instapay:['instapay','insta pay','انستاباي','إنستاباي'],
  amazon:['amazon','امازون','أمازون'],
  phone:['call','sms','اتصال','مكالمة','تليفون','موبايل','رقم','رسالة'],
  telegram:['telegram','تيليجرام','تلجرام','تليجرام','تيليغرام']
};
const normName = v => String(v || '').toLowerCase().replace(/[0-9٠-٩]+/g, ' ').replace(/[^a-z\u0600-\u06ff\s-]/g, ' ').replace(/\s+/g, ' ').trim();
function platformByName(name){
  const n = normName(name); if (!n) return '';
  for (const k in NAME_ALIASES){ if (NAME_ALIASES[k].some(a => normName(a) === n)) return k; }
  return '';
}
function platformByUrl(url){
  let host = '';
  if (/^mailto:/i.test(url)) return 'emailLink';
  if (/^(tel|sms):/i.test(url)) return 'phone';
  try { host = new URL(/^[a-z]+:/i.test(url) ? url : 'https://' + url).hostname.toLowerCase().replace(/^www\./, ''); } catch(e){ return ''; }
  if (/(^|\.)(facebook\.com|fb\.com|fb\.me|fb\.watch)$/.test(host)) return 'facebook';
  if (/(^|\.)(instagram\.com|instagr\.am)$/.test(host)) return 'instagram';
  if (/(^|\.)(twitter\.com|x\.com)$/.test(host)) return 'twitter';
  if (/(^|\.)tiktok\.com$/.test(host)) return 'tiktok';
  if (/(^|\.)(wa\.me|whatsapp\.com)$/.test(host)) return 'whatsapp';
  if (/(^|\.)(t\.me|telegram\.me|telegram\.org)$/.test(host)) return 'telegram';
  if (/(^|\.)ipn\.eg$/.test(host)) return 'instapay';
  return '';
}
function platformOfOther(o){ return platformByName(o && o.name) || platformByUrl(String((o && o.url) || '')); }

/* الترتيب المحفوظ: عناصر facebook,o0,whatsapp,phone,... (oN = ترتيب العنصر داخل others) */
function orderedLinkItems(L){
  L = L || {};
  const raw = Array.isArray(L.others) ? L.others : [];
  let order = null; const items = [];
  raw.forEach(o => {
    if (!o) return;
    if (o.name === ORDER_KEY){ order = String(o.url || '').split(',').map(x => x.trim()).filter(Boolean); }
    else items.push(o);
  });
  const seq = [], usedP = new Set(), usedO = new Set();
  (order || []).forEach(tok => {
    if (/^o\d+$/.test(tok)){
      const i = +tok.slice(1);
      if (items[i] && !usedO.has(i)){ usedO.add(i); seq.push({ t:'o', o:items[i] }); }
    } else if (DEFAULT_ORDER.includes(tok) && !usedP.has(tok)){ usedP.add(tok); seq.push({ t:'p', k:tok }); }
  });
  DEFAULT_ORDER.forEach(k => { if (!usedP.has(k)) seq.push({ t:'p', k }); });
  items.forEach((o, i) => { if (!usedO.has(i)) seq.push({ t:'o', o }); });
  return seq;
}
const realOthers = L => ((L && L.others) || []).filter(o => o && o.name !== ORDER_KEY);

function moveRow(row, dir){
  const sib = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
  if (!sib) return;
  if (dir < 0) sib.before(row); else sib.after(row);
  refreshLinkRows();
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');

function refreshLinkRows(){
  const rows = [...document.querySelectorAll('#linksBox .lrow')];
  const counter = {};
  rows.forEach((r, i) => {
    if (r.dataset.type === 'platform'){
      const k = r.dataset.platform;

      const lab = r.querySelector('.soc-name');

      lab.textContent = counter[k] > 1 ? base + ' ' + counter[k] : base;
      fillBadgeOnce(r.querySelector('.badge'), BRAND[k]);

      counter.phone = 1;
      fillBadgeOnce(r.querySelector('.badge'), BRAND.phone);
      const note = r.querySelector('.note'); if (note) note.textContent = t('callRowNote');
    } else if (r.dataset.type === 'call'){
      counter.phone = (counter.phone || 1) + 1;
      r.querySelector('.soc-name').textContent = BRAND.phone.label + ' ' + counter.phone;
      fillBadgeOnce(r.querySelector('.badge'), BRAND.phone);
      const cp = r.querySelector('.cpref'); if (cp) cp.options[0].textContent = t('optCallShort');
      const ci = rowInput(r); if (ci) ci.placeholder = t('callNumPh');
    } else {
      const n = r.querySelector('.o-name'), u = r.querySelector('.o-url');
      fillBadgeOnce(r.querySelector('.badge'), brandForOther({ name:n.value, url:u.value }));
    }
    const up = r.querySelector('.mv .up'), dn = r.querySelector('.mv .dn');
    up.disabled = i === 0; dn.disabled = i === rows.length - 1;
    up.setAttribute('aria-label', t('moveUp')); dn.setAttribute('aria-label', t('moveDown'));
    const add = r.querySelector('.act.add'); if (add){ const tx = r.dataset.type === 'phone' ? t('addCall') : t('addAccount'); add.title = tx; add.setAttribute('aria-label', tx); }
    const del = r.querySelector('.act.del'); if (del){ del.title = t('removeRow'); del.setAttribute('aria-label', t('removeRow')); }
  });
  $('addOther').disabled = extraCount() >= MAX_EXTRAS;

// بناء كل الصفوف من بيانات الروابط (أو الترتيب الافتراضي لو كانت فارغة)
function buildLinkRows(L){
  const box = $('linksBox'); box.innerHTML = '';
  L = L || {};
  orderedLinkItems(L).forEach(it => {
    if (it.t === 'p'){
      if (it.k === 'phone'){ box.appendChild(makeRow('phone')); return; }
      let v = L[it.k] || '';
      if (it.k === 'whatsapp') v = v ? v.replace(/^https:\/\/wa\.me\//, '+') : '';
      if (it.k === 'emailLink') v = v ? v.replace(/^mailto:/i, '') : '';
      box.appendChild(makeRow('platform', it.k, v));
    } else {
      const o = it.o, k = platformByName(o.name);
      if (k === 'phone'){
        const u = String(o.url || '');
        const pref = /^sms:/i.test(u) ? 'SMS' : /^https?:\/\/wa\.me\//i.test(u) ? 'WhatsApp' : 'Call';
        let v = u.replace(/^(tel|sms):/i, '').replace(/^https?:\/\/wa\.me\//i, '');
        if (pref === 'WhatsApp' && v) v = '+' + v.replace(/^\+/, '');
        box.appendChild(makeCallRow(v, pref));
      } else if (k && PRIMARY_KEYS.includes(k)){
        let v = o.url || '';
        if (k === 'whatsapp') v = v.replace(/^https:\/\/wa\.me\//, '+');
        if (k === 'emailLink') v = v.replace(/^mailto:/i, '');
        box.appendChild(makeExtraRow(k, v));
      } else box.appendChild(makeRow('custom', null, o.url, o.name));
    }
  });

}

/* تحويل المدخلات إلى روابط صحيحة */
function normUrl(v, base){
  v = String(v || '').trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^(www\.)?[a-z0-9-]+\.[a-z]{2,}\//i.test(v)) return 'https://' + v;
  return base ? base + v.replace(/^@/, '') : 'https://' + v;
}
function normalizeFor(key, raw){
  const v = String(raw || '').trim(); if (!v) return '';
  switch (key){
    case 'facebook':  return normUrl(v, 'https://facebook.com/');
    case 'instagram': return normUrl(v, 'https://instagram.com/');
    case 'twitter':   return normUrl(v, 'https://x.com/');
    case 'tiktok':    return normUrl(v, 'https://tiktok.com/@');
    case 'whatsapp':  { const wa = v.replace(/[^\d+]/g, '').replace(/^\+/, ''); return wa ? 'https://wa.me/' + wa : ''; }
    case 'emailLink': return EMAIL_RE.test(v) ? 'mailto:' + v : '';
    default:          return normUrl(v);
  }
}
function buildLinks(){
  const links = { facebook:'', instagram:'', twitter:'', tiktok:'', whatsapp:'', emailLink:'', instapay:'', amazon:'' };
  const others = [], order = [], seen = {};
  document.querySelectorAll('#linksBox .lrow').forEach(r => {
    const type = r.dataset.type;
    if (type === 'phone'){ order.push('phone'); return; }
    if (type === 'platform'){
      const key = r.dataset.platform, val = normalizeFor(key, rowInput(r).value);
      if (!val) return;
      if (!seen[key]){ seen[key] = 1; links[key] = val; order.push(key); }
      else { others.push({ name: EXTRA_NAME[key], url: val }); order.push('o' + (others.length - 1)); }
      return;
    }
    if (type === 'call'){
      const num = rowInput(r).value.replace(/[^\d+]/g, ''), pref = r.querySelector('.cpref').value;
      if (!num) return;
      const url = pref === 'WhatsApp' ? 'https://wa.me/' + num.replace(/^\+/, '') : (pref === 'SMS' ? 'sms:' : 'tel:') + num;
      others.push({ name: pref === 'SMS' ? 'SMS' : 'Call', url }); order.push('o' + (others.length - 1));
      return;
    }
    const name = r.querySelector('.o-name').value.trim(), url = normUrl(r.querySelector('.o-url').value);
    if (name && url){ others.push({ name, url }); order.push('o' + (others.length - 1)); }
  });
  // نحفظ الترتيب فقط لو اختلف عن الترتيب الافتراضي (أول عنصر في others حتى لا يُقص)
  const expected = [];
  DEFAULT_ORDER.forEach(k => { if (k === 'phone' || links[k]) expected.push(k); });
  others.forEach((_, i) => expected.push('o' + i));
  const custom = order.join(',') !== expected.join(',');
  links.others = custom ? [{ name: ORDER_KEY, url: order.join(',') }].concat(others) : others;
  return links;
}

$('profileForm').addEventListener('submit', async e => {

  if (coverUrl && !/^https?:\/\//i.test(coverUrl)) return setHint(err, t('errUrl'), 'bad');

    const mv = rowInput(r).value.trim();
    if (mv && !EMAIL_RE.test(mv)) return setHint(err, t('errEmail'), 'bad');

    coverImageUrl: coverUrl,
    coverImageBase64: coverData,
    bio: $('pBio').value.trim(),

  };

  setBusy($('pSubmit'), true);

    if (!name){ setBusy($('pSubmit'), false); return setHint(err, t('e_INVALID_NAME'), 'bad'); }
    const tok = sessionStorage.getItem('sessionToken') || '';
    if (!pw && !tok){ setBusy($('pSubmit'), false); return setHint(err, t('errFill'), 'bad'); }
    r = await api('updateProfile', Object.assign({ username: editingUser, password: pw, sessionToken: tok, fullName: name }, common));
  } else {
    r = await api('register', Object.assign({}, signup.data, common));
  }
  setBusy($('pSubmit'), false);

  if (!r.ok){
    if (edit && r.error === 'SESSION_EXPIRED'){
      sessionStorage.removeItem('sessionToken'); sessionStorage.removeItem('profile');
      setHint(err, errMsg(r.error), 'bad');
      setTimeout(() => openEdit(editingUser), 1500);
      return;
    }
    if (edit && r.error === 'INVALID_CREDENTIALS') return setHint(err, errMsg(r.error), 'bad');
    if (!edit && ['EMAIL_NOT_VERIFIED','EMAIL_EXISTS','USERNAME_TAKEN'].includes(r.error)) show('signup');
    return setHint(err, errMsg(r.error), 'bad');
  }

  sessionStorage.setItem('profile', JSON.stringify(r.profile));
  if (edit){
    if ($('pEditPass').value) sessionStorage.setItem('sessionPass', $('pEditPass').value);
    toast(t('updated'), 'ok');
  } else {
    if (r.sessionToken){ sessionStorage.setItem('sessionToken', r.sessionToken); sessionStorage.removeItem('sessionPass'); }
    else { sessionStorage.removeItem('sessionToken'); sessionStorage.setItem('sessionPass', signup.data.password); }
    toast(CONFIG.API_URL ? t('saved') : t('savedDemo'), 'ok');
    resetSignup();
  }
  renderCard(r.profile); show('card');
});

function safeHref(u){ return /^(https?:|mailto:|tel:|sms:)/i.test(u) ? u : ''; }
function linkButton(kind, label, href, shown){
  const a = document.createElement('a');
  a.className = 'linkbtn'; a.href = href; a.rel = 'noopener noreferrer';
  if (/^https?:/i.test(href)) a.target = '_blank';
  const b = document.createElement('span'); b.className = 'badge'; fillBadge(b, kind);
  const tt = document.createElement('span'); tt.className = 't'; tt.textContent = label;
  const s = document.createElement('small'); s.textContent = shown || '';
  a.append(b, tt, s); return a;
}
const USER_PATH_RE = /^\/?@?([a-z0-9_.]{3,30})\/?$/i;
function profileUrl(username){
  const base = (CONFIG.PROFILE_BASE_URL || location.origin).replace(/\/+$/, '');
  return base + '/' + encodeURIComponent(username);
}
function setCardMode(isPublic){
  $('shareBox').style.display = isPublic ? 'none' : '';
  $('cActions').style.display = isPublic ? 'none' : '';

function renderCard(p, isPublic){
  currentCard = p;
  applyCardCustomization();
  statInc(isPublic ? 'public_views' : 'card_views');
  setupFeatureButtons();
  setCardMode(!!isPublic);

    $('cLink').value = url;
    $('openLinkBtn').href = url;
    makeQr(url);
    $('editLinkBtn').href = profileUrl(p.username) + '/edit';
  }
  $('cName').textContent = p.fullName || '';
  $('cUser').textContent = '@' + (p.username || '');
  const bioEl = $('cBio');
  if (p.bio){ bioEl.textContent = p.bio; bioEl.style.display = ''; } else { bioEl.style.display = 'none'; }
  const img = $('cImg');
  if (p.imageUrl && /^(https?:|data:image\/)/i.test(p.imageUrl)){
    img.src = p.imageUrl; img.style.display = 'block'; $('cPh').style.display = 'none';
    img.onerror = () => { img.style.display = 'none'; $('cPh').style.display = ''; };
  } else { img.style.display = 'none'; $('cPh').style.display = ''; }

  const cov = $('cCoverImg');
  if (p.coverImageUrl && /^(https?:|data:image\/)/i.test(p.coverImageUrl)){
    cov.src = p.coverImageUrl; cov.style.display = 'block'; $('cCoverPh').style.display = 'none';
    cov.onerror = () => { cov.style.display = 'none'; $('cCoverPh').style.display = 'flex'; };
  } else { cov.style.display = 'none'; $('cCoverPh').style.display = 'flex'; }

  const box = $('cLinks'); box.innerHTML = '';
  closeLinkGroup();
  const L = p.links || {};
  let count = 0;
  const shownOf = h => h.replace(/^https?:\/\/(www\.)?/, '').replace(/^(mailto|tel|sms):/i, '');
  const entries = [];
  orderedLinkItems(L).forEach(it => {
    if (it.t === 'p'){
      if (it.k === 'phone'){
        if (!p.phone) return;
        const num = String(p.phone).replace(/[^\d+]/g, '');
        const pref = p.callPreference || 'Call';
        let href = 'tel:' + num, label = BRAND.phone.label;
        if (pref === 'WhatsApp'){ href = 'https://wa.me/' + num.replace(/^\+/, ''); label = 'WhatsApp'; }
        else if (pref === 'SMS'){ href = 'sms:' + num; label = 'SMS'; }
        else if (pref === 'Email' && p.email){ href = 'mailto:' + p.email; label = 'Email'; }
        entries.push({ kind:BRAND.phone, label, href, shown:p.phone, gkey:linkGroupKey(href, 'phone') });
        return;
      }
      const h = safeHref(L[it.k]); if (!h) return;
      entries.push({ kind:BRAND[it.k], label:BRAND[it.k].label, href:h, shown:shownOf(h), gkey:linkGroupKey(h, it.k) });
    } else {
      const o = it.o, h = safeHref(o.url); if (!h) return;
      entries.push({ kind:brandForOther(o), label:o.name, href:h, shown:shownOf(h), gkey:linkGroupKey(h, platformOfOther(o)) });
    }
  });
  // لو المنصة لها أكثر من حساب/رقم → زر واحد يفتح نافذة منبثقة بالأزرار
  const gcount = {};
  entries.forEach(en => { if (en.gkey) gcount[en.gkey] = (gcount[en.gkey] || 0) + 1; });
  const doneG = {};
  entries.forEach(en => {
    const g = en.gkey;
    if (!g || gcount[g] < 2){ box.appendChild(linkButton(en.kind, en.label, en.href, en.shown)); count++; return; }
    if (doneG[g]) return;
    doneG[g] = 1;
    box.appendChild(groupButton(g, entries.filter(x => x.gkey === g))); count++;
  });
  $('cEmpty').style.display = count ? 'none' : 'block';
}
/* ---- تجميع الحسابات المتعددة لنفس المنصة في زر واحد + نافذة منبثقة ---- */
function linkGroupKey(href, k){
  if (/^https?:\/\/wa\.me\//i.test(href)) return 'whatsapp';
  if (/^sms:/i.test(href)) return 'phone:SMS';
  if (/^tel:/i.test(href)) return 'phone:Call';
  if (/^mailto:/i.test(href)) return 'emailLink';
  return k || '';
}
function linkGroupMeta(g){
  if (g.indexOf('phone') === 0) return { kind:BRAND.phone, label: g === 'phone:SMS' ? 'SMS' : BRAND.phone.label };
  const b = BRAND[g] || { bg:'#5b6b8f', g:'?', label:g };
  return { kind:b, label:b.label };
}
function groupButton(g, list){
  const meta = linkGroupMeta(g);
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'linkbtn grpbtn'; b.setAttribute('aria-haspopup', 'dialog');
  const bd = document.createElement('span'); bd.className = 'badge'; fillBadge(bd, meta.kind);
  const tt = document.createElement('span'); tt.className = 't'; tt.textContent = meta.label;
  const c = document.createElement('span'); c.className = 'cnt'; c.textContent = String(list.length);
  b.append(bd, tt, c);
  b.addEventListener('click', () => openLinkGroup(meta, list));
  return b;
}
function openLinkGroup(meta, list){
  const panel = $('groupPanel'), box = $('groupContent');
  $('groupTitle').textContent = meta.label + ' (' + list.length + ')';
  box.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'linklist';
  list.forEach(en => {
    const label = platformByName(en.label) ? meta.label : en.label;
    wrap.appendChild(linkButton(meta.kind, label, en.href, en.shown));
  });
  box.appendChild(wrap);
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
}
function closeLinkGroup(){
  const panel = $('groupPanel'); if (!panel) return;
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
}

/* حفظ جهة الاتصال (vCard) */
function vcEsc(s){ return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
$('vcfBtn').addEventListener('click', () => {
  const p = currentCard; if (!p) return;
  statInc('contacts');
  const L = p.links || {};
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + vcEsc(p.fullName || p.username)];
  const phone = String(p.phone || '').replace(/[^\d+]/g, '');
  if (phone) lines.push('TEL;TYPE=CELL,VOICE:' + phone);
  const email = p.email || String(L.emailLink || '').replace(/^mailto:/i, '');
  if (email) lines.push('EMAIL;TYPE=INTERNET:' + email);
  lines.push('URL:' + profileUrl(p.username || ''));
  if (p.bio) lines.push('NOTE:' + vcEsc(p.bio));
  if (p.imageUrl && /^https?:/i.test(p.imageUrl)) lines.push('PHOTO;VALUE=URL:' + p.imageUrl);
  [['facebook','Facebook'],['instagram','Instagram'],['twitter','X'],['tiktok','TikTok'],['whatsapp','WhatsApp'],['instapay','InstaPay'],['amazon','Amazon']].forEach(k => {
    if (L[k[0]]) lines.push('URL;TYPE=' + k[1] + ':' + vcEsc(L[k[0]]));
  });
  realOthers(L).forEach(o => { if (!o.url) return; if (/^tel:/i.test(o.url)) lines.push('TEL;TYPE=VOICE:' + o.url.replace(/^tel:/i, '')); else lines.push('URL:' + vcEsc(o.url)); });
  lines.push('END:VCARD');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.fullName || p.username || 'contact') + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast(t('contactSaved'), 'ok');
});

      <div class="feature-note">يستخدم WebAuthn/قفل الجهاز إذا كان المتصفح والجهاز يدعمانه. يعمل على HTTPS ولا يحتاج Backend.</div>
    </div>

    <div class="feature-section">
      <h3>📡 فحص NFC</h3>
      <div class="nfc-status" id="nfcStatusWeb">جاري الفحص…</div>
      <div class="feature-choice" style="margin-top:8px">
        <button class="btn soft" id="nfcWriteWeb">✍️ كتابة رابط NFC</button>
        <button class="btn ghost" id="nfcReadWeb">📖 قراءة NFC</button>
      </div>
      <div class="feature-note">Web NFC متاح بشكل محدود، غالباً على Chrome في Android مع HTTPS. إذا لم يدعم المتصفح Web NFC سيظهر ذلك هنا.</div>
    </div>

    <div class="feature-section">
      <h3>📴 البطاقة Offline</h3>
      <button class="btn soft" id="saveOfflineWeb" style="width:100%">💾 حفظ نسخة Offline</button>
      <button class="btn ghost" id="openOfflineWeb" style="width:100%;margin-top:8px">📴 فتح النسخة المحفوظة</button>
      <div class="feature-note">${cachedProfile()?'توجد نسخة محفوظة على هذا الجهاز.':'لا توجد نسخة Offline محفوظة بعد.'}</div>
    </div>
  `;

  $('resetStatsWeb').onclick=()=>{const x=featureState();x.stats={};saveFeatureState(x);renderFeaturePanel();toast('تم تصفير الإحصائيات ✓','ok')};
  content.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{const x=featureState();x.style=b.dataset.style;saveFeatureState(x);applyCardCustomization();renderFeaturePanel();if(currentCard)renderCard(currentCard,false);});
  content.querySelectorAll('[data-accent]').forEach(b=>b.onclick=()=>{const x=featureState();x.accent=b.dataset.accent;saveFeatureState(x);applyCardCustomization();renderFeaturePanel();if(currentCard)renderCard(currentCard,false);});
  $('testNotif').onclick=async()=>{await localNotify('Abo El-Fadl NFC','هذا إشعار تجريبي من التطبيق');renderFeaturePanel()};
  if($('clearNotif'))$('clearNotif').onclick=()=>{const x=featureState();x.notifications=[];saveFeatureState(x);renderFeaturePanel()};
  $('appLockBtn').onclick=async()=>{await toggleWebLock();renderFeaturePanel()};
  $('lockNowWeb').onclick=async()=>{await lockWebNow()};
  $('saveOfflineWeb').onclick=()=>{saveOfflineProfile(p);toast('تم حفظ نسخة Offline ✓','ok');renderFeaturePanel()};
  $('openOfflineWeb').onclick=()=>{openOfflineWebCard()};
  updateNfcStatus($('nfcStatusWeb'));
  $('nfcWriteWeb').onclick=()=>writeNfcWeb(p);
  $('nfcReadWeb').onclick=()=>readNfcWeb();
}
function updateNfcStatus(el){
  if(!el)return;
  const supported='NDEFReader' in window;
  el.innerHTML=supported?'✅ المتصفح يعلن دعم Web NFC.':'❌ Web NFC غير مدعوم في هذا المتصفح.';
}
async function writeNfcWeb(p){
  if(!('NDEFReader' in window)){toast('Web NFC غير مدعوم في المتصفح','bad');return}
  const url=profileUrl(p.username||'');
  try{
    const w=new NDEFReader(); await w.write(url);
    statInc('nfc_write'); toast('تمت كتابة رابط البطاقة على NFC ✓','ok');
    localNotify('Abo El-Fadl NFC','تمت كتابة رابط البطاقة على NFC');
  }catch(e){toast('تعذر الكتابة على NFC: '+(e.message||'ألغيت العملية'),'bad')}
}
async function readNfcWeb(){
  if(!('NDEFReader' in window)){toast('Web NFC غير مدعوم في المتصفح','bad');return}
  try{
    const r=new NDEFReader();
    await r.scan();
    r.onreading=event=>{
      statInc('nfc_read');
      const record=event.message.records && event.message.records[0];
      if(!record){toast('لم يتم العثور على سجل NFC','bad');return}
      try{
        const dec=new TextDecoder(record.encoding||'utf-8');
        const txt=record.recordType==='url'?new TextDecoder().decode(record.data):dec.decode(record.data);
        toast('تمت قراءة NFC ✓','ok');
        if(/^https?:\/\//i.test(txt)) location.href=txt;
        else navigator.clipboard?.writeText(txt);
      }catch(e){toast('تمت قراءة البطاقة لكن تعذر تحليل المحتوى','bad')}
    };
    toast('قرّب بطاقة NFC من الهاتف…');
  }catch(e){toast('تعذر بدء قراءة NFC: '+(e.message||'ألغيت العملية'),'bad')}
}
function openOfflineWebCard(){
  const p=cachedProfile();
  if(!p){toast('لا توجد نسخة Offline محفوظة بعد.','bad');return}
  statInc('offline_opens'); currentCard=p; renderCard(p,false);
  setFeaturePanel(false);
  toast('تم فتح النسخة Offline ✓','ok');
}
function randomBytes(n){
  const a=new Uint8Array(n); crypto.getRandomValues(a); return a;
}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function lockCredentialId(){return featureState().lockCredential||''}
async function registerWebLock(){
  if(!window.PublicKeyCredential||!navigator.credentials){toast('قفل الجهاز غير مدعوم في هذا المتصفح','bad');return false}
  try{
    const userId=randomBytes(16), challenge=randomBytes(32);
    const cred=await navigator.credentials.create({publicKey:{
      challenge,rp:{name:'Abo El-Fadl NFC',id:location.hostname},
      user:{id:userId,name:'abualfadl-user',displayName:'Abo El-Fadl NFC'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{residentKey:'preferred',userVerification:'required'},
      timeout:60000,attestation:'none'
    }});
    if(!cred)return false;
    const x=featureState();x.lockCredential=b64url(cred.rawId);x.appLock=true;saveFeatureState(x);
    toast('تم تفعيل قفل التطبيق ✓','ok');return true;
  }catch(e){toast('تعذر تفعيل قفل التطبيق: '+(e.message||'ألغيت العملية'),'bad');return false}
}
async function verifyWebLock(){
  const id=lockCredentialId(); if(!id)return false;
  try{
    const bin=atob(id.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((id.length+3)%4));
    const allowId=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const challenge=randomBytes(32);
    const c=await navigator.credentials.get({publicKey:{
      challenge,allowCredentials:[{type:'public-key',id:allowId}],userVerification:'required',timeout:60000
    }});
    return !!c;
  }catch(e){return false}
}
async function toggleWebLock(){
  const fs=featureState();
  if(fs.appLock){fs.appLock=false;saveFeatureState(fs);toast('تم إيقاف قفل التطبيق');return}
  await registerWebLock();
}
async function lockWebNow(){
  const fs=featureState();
  if(!fs.appLock){toast('فعّل قفل التطبيق أولاً','bad');return}
  sessionStorage.setItem('af_lock_pending','1');
  showLockOverlay();
}
function showLockOverlay(){
  if($('webLockOverlay'))return;
  const d=document.createElement('div');d.id='webLockOverlay';d.className='feature-panel open';
  d.innerHTML='<div class="feature-sheet" style="text-align:center"><h2>🔐 التطبيق مقفول</h2><p class="feature-note">استخدم قفل الجهاز/البصمة للمتابعة.</p><button class="btn primary" id="unlockWebBtn" style="width:100%;margin-top:12px">فتح التطبيق</button></div>';
  document.body.appendChild(d);
  $('unlockWebBtn').onclick=async()=>{if(await verifyWebLock()){sessionStorage.removeItem('af_lock_pending');d.remove();toast('تم فتح التطبيق ✓','ok')}else toast('تعذر التحقق','bad')};
}
window.addEventListener('visibilitychange',()=>{
  const fs=featureState();
  if(document.visibilityState==='hidden'&&fs.appLock)sessionStorage.setItem('af_lock_pending','1');
  if(document.visibilityState==='visible'&&fs.appLock&&sessionStorage.getItem('af_lock_pending'))showLockOverlay();
});
window.addEventListener('beforeinstallprompt',e=>{window.deferredInstallPrompt=e});
function installPwaIfAvailable(){
  if(window.deferredInstallPrompt){window.deferredInstallPrompt.prompt();window.deferredInstallPrompt=null}
}
function setupFeatureButtons(){
  const privateCard=!!storedProfile();
  $('featureTools').style.display=privateCard?'grid':'none';
  if($('featuresBtn'))$('featuresBtn').onclick=()=>setFeaturePanel(true);
  if($('offlineQuickBtn'))$('offlineQuickBtn').onclick=()=>openOfflineWebCard();
}

/* ========================= التشغيل ========================= */
applyLang();
initGoogle();
applyCardCustomization();
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
const EDIT_PATH_RE = /^\/@?([a-z0-9_.]{3,30})\/edit\/?$/i;
(async function boot(){
  const em = location.pathname.match(EDIT_PATH_RE);
  if (em){ openEdit(decodeURIComponent(em[1]).toLowerCase()); return; }
  const m = location.pathname.match(USER_PATH_RE);
  if (m){
    // صفحة البطاقة العامة: /@username
    $('pubMsg').textContent = t('loadingCard'); show('pubmsg');
    const r = await apiGet('profile', { username: decodeURIComponent(m[1]) });
    if (!r.ok || !r.profile){
      $('pubMsg').textContent = r.error === 'NETWORK' ? errMsg('NETWORK') : t('cardNotFound');
      $('pubHome').style.display = 'inline-flex';
      return;
    }
    document.title = (r.profile.fullName || m[1]) + ' | Abo El-Fadl NFC';
    renderCard(r.profile, true); show('card');
    const me = storedProfile();
    if (me && me.username === r.profile.username){
      $('editLinkBtn').href = profileUrl(r.profile.username) + '/edit';
      $('editLinkBtn').style.display = 'inline-flex';
    }
    return;
  }
  try {
    const p = storedProfile();
    if (p && p.username){
      const dest = sessionStorage.getItem('afterLogin');
      if (dest){ sessionStorage.removeItem('afterLogin'); location.replace(dest); return; }
      renderCard(p); show('card');
    }
  } catch(e){}
})();
</script>
