<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء بطاقة تعريف رقمية</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #111827;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        /* صورة المستخدم */

        .photo-area {
            text-align: center;
            margin-bottom: 22px;
        }

        .photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #f3f4f6;
            border: 3px solid #e5e7eb;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #9ca3af;
            font-size: 13px;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-btn {
            display: inline-block;
            background: #111827;
            color: white;
            padding: 10px 17px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        #photo {
            display: none;
        }

        .username-box {
            position: relative;
        }

        .username-prefix {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            direction: ltr;
            pointer-events: none;
        }

        .username-box input {
            padding-left: 35px;
            direction: ltr;
            text-align: left;
        }

        .username-info {
            margin-top: 6px;
            color: #6b7280;
            font-size: 12px;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .result-link {
            margin-top: 12px;
            direction: ltr;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>إنشاء بطاقة تعريف رقمية</h1>

    <p class="subtitle">
        أدخل بياناتك لإنشاء بطاقة التعريف الرقمية الخاصة بك
    </p>


    <!-- الصورة -->

    <div class="photo-area">

        <div class="photo-preview" id="photoPreview">
            اختر صورة
        </div>

        <label for="photo" class="upload-btn">
            📷 اختيار الصورة
        </label>

        <input
            type="file"
            id="photo"
            accept="image/*"
        >

    </div>


    <!-- البيانات -->

    <form id="profileForm">

        <div class="field">

            <label for="name">
                الاسم الكامل
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="مثال: خالد محمد"
                required
            >

        </div>


        <div class="field">

            <label for="phone">
                رقم الهاتف
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="01000000000"
                required
            >

        </div>


        <div class="field">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >

        </div>


        <div class="field">

            <label for="job">
                المسمى الوظيفي
            </label>

            <input
                type="text"
                id="job"
                name="job"
                placeholder="Front-End Developer"
                required
            >

        </div>


        <div class="field">

            <label for="contact">
                رابط التواصل
            </label>

            <input
                type="url"
                id="contact"
                name="contact"
                placeholder="https://wa.me/201000000000"
            >

        </div>


        <div class="field">

            <label for="username">
                اسم المستخدم
            </label>

            <div class="username-box">

                <span class="username-prefix">@</span>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Khaled"
                    pattern="[A-Za-z0-9_]+"
                    minlength="3"
                    maxlength="30"
                    required
                >

            </div>

            <div class="username-info">
                استخدم الحروف الإنجليزية والأرقام و _
            </div>

        </div>


        <button type="submit" id="submitBtn">
            إنشاء البطاقة
        </button>

    </form>


    <div id="message" class="message"></div>

</div>


<script>

    /*
     * ==========================================
     * رابط Google Apps Script
     * ==========================================
     *
     * سنضع هنا رابط الـ Web App بعد إنشاء
     * Google Apps Script.
     */

    const GOOGLE_SCRIPT_URL =
        "ضع_هنا_رابط_Google_Apps_Script";


    // عناصر الصفحة

    const form = document.getElementById("profileForm");

    const photoInput =
        document.getElementById("photo");

    const photoPreview =
        document.getElementById("photoPreview");

    const submitBtn =
        document.getElementById("submitBtn");

    const message =
        document.getElementById("message");


    let compressedImage = "";


    /*
     * ==========================================
     * معاينة وضغط الصورة
     * ==========================================
     */

    photoInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) return;


        if (!file.type.startsWith("image/")) {

            showMessage(
                "من فضلك اختر صورة صحيحة",
                "error"
            );

            return;
        }


        const reader = new FileReader();


        reader.onload = function (event) {

            const img = new Image();


            img.onload = function () {

                const canvas =
                    document.createElement("canvas");

                const maxSize = 800;

                let width = img.width;
                let height = img.height;


                if (width > height) {

                    if (width > maxSize) {

                        height =
                            height * maxSize / width;

                        width = maxSize;
                    }

                } else {

                    if (height > maxSize) {

                        width =
                            width * maxSize / height;

                        height = maxSize;
                    }
                }


                canvas.width = width;
                canvas.height = height;


                const ctx =
                    canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                /*
                 * ضغط الصورة إلى JPEG
                 */

                compressedImage =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.75
                    );


                /*
                 * عرض الصورة
                 */

                photoPreview.innerHTML =
                    `<img src="${compressedImage}" alt="الصورة الشخصية">`;

            };


            img.src = event.target.result;

        };


        reader.readAsDataURL(file);

    });


    /*
     * ==========================================
     * إرسال البيانات
     * ==========================================
     */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const job =
            document.getElementById("job").value.trim();

        const contact =
            document.getElementById("contact").value.trim();

        const username =
            document.getElementById("username").value.trim();


        /*
         * التأكد من الصورة
         */

        if (!compressedImage) {

            showMessage(
                "من فضلك اختر صورتك الشخصية أولًا",
                "error"
            );

            return;
        }


        /*
         * التأكد من اسم المستخدم
         */

        if (!/^[A-Za-z0-9_]+$/.test(username)) {

            showMessage(
                "اسم المستخدم يجب أن يحتوي على حروف إنجليزية وأرقام و _ فقط",
                "error"
            );

            return;
        }


        /*
         * التأكد من رابط Google Apps Script
         */

        if (
            !GOOGLE_SCRIPT_URL ||
            GOOGLE_SCRIPT_URL.includes("ضع_هنا")
        ) {

            showMessage(
                "لم يتم ربط Google Apps Script بالموقع بعد",
                "error"
            );

            return;
        }


        /*
         * تجهيز البيانات
         */

        const data = {

            action: "createProfile",

            name: name,

            phone: phone,

            email: email,

            job: job,

            contact: contact,

            username: username,

            image: compressedImage

        };


        /*
         * تغيير حالة الزر
         */

        submitBtn.disabled = true;

        submitBtn.textContent =
            "جاري إنشاء البطاقة...";


        try {

            const response =
                await fetch(
                    GOOGLE_SCRIPT_URL,
                    {
                        method: "POST",

                        body: JSON.stringify(data)
                    }
                );


            const result =
                await response.json();


            if (result.success) {

                showMessage(
                    `
                    تم إنشاء البطاقة بنجاح ✅
                    <div class="result-link">
                        <br>
                        رابط البطاقة:
                        <br>
                        <strong>
                            ${result.url}
                        </strong>
                    </div>
                    `,
                    "success"
                );


                form.reset();

                photoPreview.innerHTML =
                    "اختر صورة";

                compressedImage = "";


            } else {

                showMessage(
                    result.message ||
                    "حدث خطأ أثناء إنشاء البطاقة",
                    "error"
                );

            }


        } catch (error) {

            console.error(error);

            showMessage(
                "تعذر الاتصال بالخادم",
                "error"
            );

        }


        submitBtn.disabled = false;

        submitBtn.textContent =
            "إنشاء البطاقة";

    });


    /*
     * ==========================================
     * رسائل الحالة
     * ==========================================
     */

    function showMessage(text, type) {

        message.innerHTML = text;

        message.className =
            "message " + type;

    }

</script>

</body>
</html>
